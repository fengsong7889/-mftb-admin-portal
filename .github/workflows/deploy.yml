name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # 质量门禁与构建合并为同一 job：旧实现 quality-gate 与 build 两个 job 各 `npm ci` 一次、
  # 各跑一遍 tsc（Type Check 步骤 + build:strict 内的 tsc），属纯重复工作。
  # 门禁清单一项不减；同一 job 内顺序执行，构建天然依赖全部门禁通过。
  build:
    runs-on: ubuntu-latest
    steps:
      # 取足够历史：构建期要把最近提交写进 version.json 供「版本更新弹窗」展示更新内容
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Lint
        run: npm run lint
      - name: Type Check
        run: npm run typecheck
      - name: Menu Consistency
        run: npm run check:menu
      - name: Dependency Boundary
        run: npm run check:boundary
      - name: Engineering Registry
        run: npm run check:registry
      # 应用路由清单（§4.1 拆分基线）：App.tsx 里该应用的路由变了而清单没更新 → 失败
      - name: App Route Inventory
        run: npm run check:routes
      - name: Stat Card Order
        run: npm run check:stat-order
      - name: Confirm Modal Style
        run: npm run check:confirm-modal
      - name: i18n Coverage
        run: npm run check:i18n
      - name: i18n Fallback Copy
        run: npm run check:i18n-fallback
      - name: Secret Scan
        run: npm run secret-scan
      - name: Test
        run: npm run test:run
      # 上面已跑过完整 typecheck，这里只打包，不再走 build:strict 重复执行 tsc；
      # 本地仍保留 `npm run build:strict` 作为单命令入口。
      - name: Build
        if: github.event_name == 'push'
        run: npm run build
      # 站点装配清单（方案 §4.2）：产物 → 应用归属 + sha256，随 dist 一起发布，
      # 后续「单应用回滚 / 复用已验证旧产物」全部按该清单校验，不靠「最新版本」猜。
      - name: Site assembly manifest
        if: github.event_name == 'push'
        run: npm run build:manifest
      # 清单自检（sha256 合法、无重复登记、每个应用都有产物）：
      # 装配规则判错会把旧 chunk 混进新站点，所以它是发布门禁而不是提示
      - name: Site assembly check
        if: github.event_name == 'push'
        run: npm run assemble:check
      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# 回滚说明：
# 1. 在 GitHub Actions 页面找到上一个成功的 Deploy workflow
# 2. 使用 workflow_dispatch 手动触发该 workflow
# 3. 或通过 git revert 回退代码后重新 push 到 main
