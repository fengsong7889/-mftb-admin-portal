name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # 质量门禁与构建合并为同一 job：旧实现 quality-gate 与 build 两个 job 各 `npm ci` 一次、
  # 各跑一遍 tsc（Type Check 步骤 + build:strict 内的 tsc），属纯重复工作。
  # 门禁清单一项不减；同一 job 内顺序执行，构建天然依赖全部门禁通过。
  build:
    runs-on: ubuntu-latest
    steps:
      # 取足够历史：构建期要把最近提交写进 version.json 供「版本更新弹窗」展示更新内容
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Lint
        run: npm run lint

      # tsc 在本仓库体量下已越过 Node 默认 ~2GB 老生代上限：裸跑 `npm run typecheck` 会在
      # **同一份代码**上间歇性 V8 OOM——退出码 134、日志末尾是
      # `FATAL ERROR: Ineffective mark-compacts near heap limit`，而不是任何 TS 错误行。
      # 2026-11-04 第五批（#17）合入 main 时实踩：同一 commit 在 PR 事件绿、在 push 事件崩，
      # 后续步骤全 skipped、产物不上传，靠 `gh run rerun --failed` 才解除部署阻塞。
      # 本地实测阈值（同一棵树、每次先删 tsconfig.tsbuildinfo 保证等效）：2048MB 必崩、3072MB 起通过。
      #
      # 堆上限按 runner 实际内存算，不写死：仓库里读不到 runner 规格，
      # 写小了照样崩，写大了在小规格 self-hosted 机器上会把内存打满。
      # 取内存的 3/4，下限 3072（实测可过）、上限 8192（够用且不过度承诺）。
      #
      # ⚠ 必须**步骤级**设 NODE_OPTIONS，不要“简化”成 job 级 env：下一步 Test 用的 vitest
      #   会按 min(CPU-1, 内存GB/2) 开多个 fork 并继承同一份 NODE_OPTIONS，几份大堆叠起来
      #   正好复现「慢=超时」的集体假红（见 vitest.config.ts 顶部注释）。
      #   日后若别的 Node 步骤出现同样的 134 特征，照本步骤加步骤级 env，而不是提到 job 级。
      - name: Resolve type-check heap
        id: tscheap
        run: |
          total_mb=$(awk '/MemTotal/ {print int($2/1024)}' /proc/meminfo)
          heap=$(( total_mb * 3 / 4 ))
          [ "$heap" -lt 3072 ] && heap=3072
          [ "$heap" -gt 8192 ] && heap=8192
          echo "runner 内存 ${total_mb} MB → tsc 堆上限设为 ${heap} MB"
          echo "heap=${heap}" >> "$GITHUB_OUTPUT"
      - name: Type Check
        env:
          NODE_OPTIONS: --max-old-space-size=${{ steps.tscheap.outputs.heap }}
        # 失败时把「不许绕过门禁」写进日志：本步骤的正确修法是上调上面的堆上限，
        # 不是跳过类型检查、不是换更宽松的调用、也不是放宽 tsconfig。
        run: |
          set +e
          npm run typecheck
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::typecheck 失败 (exit ${code})。若日志含 'heap out of memory' 或退出码 134，说明堆上限仍不足——请上调 Resolve type-check heap 的取值，不得跳过本步骤或放宽 tsconfig。"
          fi
          exit "$code"
      - name: Menu Consistency
        run: npm run check:menu
      - name: Dependency Boundary
        run: npm run check:boundary
      - name: Engineering Registry
        run: npm run check:registry

      # §六 回归门槛：《稳定性与业务回归门槛》的 8 类保护对象必须都有真实测试集合，
      # 且测试文件总数不得低于基线（防止「删测试换绿灯」）。
      - name: Regression Gates (§6)
        run: npm run check:regression
      # 应用路由清单（§4.1 拆分基线）：App.tsx 里该应用的路由变了而清单没更新 → 失败
      - name: App Route Inventory
        run: npm run check:routes
      - name: Stat Card Order
        run: npm run check:stat-order
      - name: Confirm Modal Style
        run: npm run check:confirm-modal
      # 主题令牌棘轮门禁（方案 §8.2）：裸色值只减不增 + 令牌双源一致，与本地 npm run verify 同序（confirm-modal 之后、i18n 之前）
      - name: Theme Tokens
        run: npm run check:theme-tokens
      # 半对门禁（方案 §17.2 / §18.2 第 4c 步）：拦住「一侧令牌、一侧钉裸色」的改了一半。
      # 裸色计数只降不能发现它——两侧都裸也是降；所以单独按 style 块聚合计棘轮。
      - name: Half-Pair Audit
        run: npm run check:halfpair
      - name: i18n Coverage
        run: npm run check:i18n
      - name: i18n Fallback Copy
        run: npm run check:i18n-fallback
      # 简体中文静态包门禁：zh-CN 没有静态兜底时，库里缺的 key 会按 fallbackLng 直接回退英文，
      # 且登录页（取不到数据库语言包）整页英文——繁中/英文界面看不出来，所以必须机器拦
      - name: i18n zh-CN Static Bundle
        run: npm run check:i18n-zhcn
      # 后端 resources/i18n 镜像必须与前端真源逐字节一致：镜像落后就等于 sys_translation
      # 永远同步不到新 key（2026-11-05 实测副本只有真源的一半），简体中文会大面积回退英文
      - name: i18n Backend Mirror
        run: npm run check:i18n-mirror
      # 免登界面（登录页）只能靠静态包：/translations/bundle 需要登录才拿得到。
      # 少了这道门禁，给登录页加一句新文案就会让日语/韩语/俄语登录页静默回退英文
      - name: i18n Pre-auth Static Bundle
        run: npm run check:i18n-preauth
      # gitignore 遮蔽/凭据副本守卫：两件事都不会让任何测试变红——
      # ① 忽略规则写宽，把已跟踪的入库模板静默挡出 git status 视野；
      # ② 本地凭据备份（形如 backend/.env.local.bak-<日期>）没被忽略，随时被 `git add -A` 扫进公开仓。
      # secret-scan 只查已入库的硬编码凭据，这两类“还没入库 / 已出库”只能在本门禁拦住。
      - name: Ignore Shadow Guard
        run: npm run check:ignore-shadow
      - name: Secret Scan
        run: npm run secret-scan
      - name: Test
        run: npm run test:run
      # 上面已跑过完整 typecheck，这里只打包，不再走 build:strict 重复执行 tsc；
      # 本地仍保留 `npm run build:strict` 作为单命令入口。
      - name: Build
        if: github.event_name == 'push'
        run: npm run build
      # 站点装配清单（方案 §4.2）：产物 → 应用归属 + sha256，随 dist 一起发布，
      # 后续「单应用回滚 / 复用已验证旧产物」全部按该清单校验，不靠「最新版本」猜。
      - name: Site assembly manifest
        if: github.event_name == 'push'
        run: npm run build:manifest
      # 清单自检（sha256 合法、无重复登记、每个应用都有产物）：
      # 装配规则判错会把旧 chunk 混进新站点，所以它是发布门禁而不是提示
      - name: Site assembly check
        if: github.event_name == 'push'
        run: npm run assemble:check
      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# 回滚说明：
# 1. 在 GitHub Actions 页面找到上一个成功的 Deploy workflow
# 2. 使用 workflow_dispatch 手动触发该 workflow
# 3. 或通过 git revert 回退代码后重新 push 到 main
