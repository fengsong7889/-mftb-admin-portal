name: Build & Push Backend Docker Image

on:
  push:
    branches: ['main']
    paths:
      - 'backend/**'
      - '.github/workflows/backend-docker.yml'
      - 'scripts/**'
  pull_request:
    branches: ['main']
    paths:
      - 'backend/**'
      - '.github/workflows/backend-docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 生产发布串行化：迁移期间不自动取消正在运行的发布，避免并发部署相互踩踏
concurrency:
  group: backend-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mftb-admin-backend

jobs:
  # ── 后端验证与打包：一次完整 Maven 生命周期完成编译 + 全量测试 + 打包 + 迁移资源校验 ──
  # 旧实现分三步（mvn test → mvn package → Dockerfile 内再 package），同一份源码被完整编译 2~3 次，
  # 且镜像里的 JAR 与被测试的 JAR 不是同一字节。现在只编译一次，制品用摘要传递给镜像构建。
  verify:
    runs-on: ubuntu-latest
    outputs:
      jar_sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # verify = 编译 + 真实执行全部测试（不再 -DskipTests）+ 打 JAR + Jacoco 报告，一条生命周期完成
      - name: Compile, test and package (single Maven lifecycle)
        run: mvn -B verify -f backend/pom.xml

      # 断言迁移清单及其引用的 SQL 资源确实进入制品（漏打包即失败）
      # 多模块后这些资源在嵌套的业务模块 JAR 里（BOOT-INF/lib/mftb-admin-legacy-*.jar），
      # 不再直接出现在 BOOT-INF/classes/ 下；Spring 的 ClassPathResource 能穿透嵌套 jar 读取，
      # 所以这里把嵌套 JAR 抽出来查，而不是因为路径变了就不再校验。
      - name: Verify migration resources are packaged
        run: |
          set -euo pipefail
          JAR=backend/bootstrap/target/mftb-admin.jar
          test -f "$JAR" || { echo "❌ 未生成 $JAR"; exit 1; }
          LEGACY=$(unzip -Z1 "$JAR" | grep -E '^BOOT-INF/lib/mftb-admin-legacy-[0-9.]+\.jar$' | head -1)
          test -n "$LEGACY" || { echo "❌ 制品内未找到业务模块 JAR"; exit 1; }
          TMP=$(mktemp -d)
          unzip -o -q "$JAR" "$LEGACY" -d "$TMP"
          INNER="$TMP/$LEGACY"
          echo "→ 校验迁移登记表随包分发（$LEGACY）"
          unzip -Z1 "$INNER" | grep -qx 'db/migrations/catalog.json' \
            || { echo "❌ catalog.json 未打包进镜像"; exit 1; }
          echo "→ 校验被登记的 SQL 资源存在"
          for res in 09_ad_promotion.sql 13_waterfall_strategy.sql 15_hot_merchant_ad.sql 63_card_order.sql; do
            unzip -Z1 "$INNER" | grep -qx "$res" \
              || { echo "❌ 迁移资源未打包: $res"; exit 1; }
          done
          unzip -Z1 "$INNER" | grep -qx 'db/migrations/165_notification_apps_and_scenarios.sql' \
            || { echo "❌ 仓库 sql/ 目录映射资源未打包"; exit 1; }
          echo "✅ 迁移资源完整性校验通过"

      # 记录制品摘要：镜像阶段据此证明「装进镜像的就是刚跑过全量测试的那个 JAR」
      - name: Record artifact digest
        id: digest
        run: |
          set -euo pipefail
          sha=$(sha256sum backend/bootstrap/target/mftb-admin.jar | cut -d' ' -f1)
          test -n "$sha" || { echo "❌ 无法计算制品摘要"; exit 1; }
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "→ mftb-admin.jar sha256=$sha"

      - name: Upload verified jar
        uses: actions/upload-artifact@v4
        with:
          name: mftb-admin-jar
          path: backend/bootstrap/target/mftb-admin.jar
          if-no-files-found: error
          retention-days: 7

  build-and-push:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.sha }}
    steps:
      # fetch-depth: 0 拉取完整 git 历史，镜像内 .git 供「從 Git 同步版本記錄」读取全部 commit
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 镜像不再编译源码：只消费 verify job 已测试过的制品（见 backend/Dockerfile）
      - name: Download verified jar
        uses: actions/download-artifact@v4
        with:
          name: mftb-admin-jar
          path: backend/bootstrap/target

      # 摘要不一致 = 制品被替换或下载损坏，拒绝发布；不允许退化为「重新编译一份」
      - name: Verify artifact digest matches tested jar
        run: |
          set -euo pipefail
          test -n "${{ needs.verify.outputs.jar_sha256 }}" || { echo "❌ 上游未输出制品摘要"; exit 1; }
          echo "${{ needs.verify.outputs.jar_sha256 }}  backend/bootstrap/target/mftb-admin.jar" | sha256sum -c -

      - name: Resolve immutable image tag
        id: tag
        run: |
          set -euo pipefail
          test -n "${GITHUB_SHA}" || { echo "❌ GITHUB_SHA 为空，拒绝以空标签部署"; exit 1; }
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}


  # ── 自動觸發 Sealos/K8s 重新部署 ──────────────────────────────────
  # 前置條件（在 GitHub Settings → Secrets → Actions 中配置）：
  #   SEALOS_KUBECONFIG      : Sealos 集群 kubeconfig 文件內容
  #   SEALOS_DEPLOYMENT      : 後端 Deployment 名稱（預設 mftb-admin-backend）
  #   SEALOS_NAMESPACE       : K8s namespace（預設 mftb-admin）
  #   VERIFY_BASE_URL        : 驗收目標基址，如 https://mftb-admin-api.cloud.sealos.io
  #   VERIFY_USER            : 驗收帳號（最小權限專用帳號）
  #   VERIFY_PASS            : 驗收帳號密碼
  # 如未配置 SEALOS_KUBECONFIG，該步驟自動跳過，不影響鏡像構建。
  deploy:
    if: github.event_name == 'push'
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      HAS_SEALOS: ${{ secrets.SEALOS_KUBECONFIG != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v5

      - name: Skip if no kubeconfig
        if: env.HAS_SEALOS != 'true'
        run: echo "SEALOS_KUBECONFIG not configured, skipping deploy"

      - name: Set up kubectl
        if: env.HAS_SEALOS == 'true'
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        if: env.HAS_SEALOS == 'true'
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.SEALOS_KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Rollout restart deployment
        if: env.HAS_SEALOS == 'true'
        env:
          DEPLOYMENT: ${{ secrets.SEALOS_DEPLOYMENT || 'mftb-admin-backend' }}
          NAMESPACE:  ${{ secrets.SEALOS_NAMESPACE  || 'mftb-admin' }}
          IMAGE_TAG:  ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          echo "→ 更新 ${DEPLOYMENT} 鏡像為 ${IMAGE}:${IMAGE_TAG}"
          test -n "${IMAGE_TAG}" || { echo "❌ IMAGE_TAG 為空，拒絕部署"; exit 1; }
          kubectl set image deployment/${DEPLOYMENT} \
            ${DEPLOYMENT}=${IMAGE}:${IMAGE_TAG} \
            -n ${NAMESPACE}

          echo "→ 等待 rollout 完成（超時 180s）"
          kubectl rollout status deployment/${DEPLOYMENT} \
            -n ${NAMESPACE} --timeout=180s

          echo "✅ 部署完成：${DEPLOYMENT} @ ${IMAGE_TAG}"

      # ── 部署後驗收：就緒探針 + 關鍵業務接口，任一失敗即中止作業 ──
      - name: Post-deploy verification
        if: env.HAS_SEALOS == 'true'
        env:
          BASE_URL:    ${{ secrets.VERIFY_BASE_URL }}
          VERIFY_USER: ${{ secrets.VERIFY_USER }}
          VERIFY_PASS: ${{ secrets.VERIFY_PASS }}
          BUILD_TAG:   ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          echo "→ 執行部署驗收腳本..."
          bash scripts/verify-deploy.sh
