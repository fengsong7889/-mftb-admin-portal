server:
  port: 8080
  # 优雅退出（方案 §六「发布保留就绪/存活检查、优雅退出和请求排空」）：
  # 收到 SIGTERM 后停止接新请求，等在途请求完成后才退出；配合 K8s preStop 与
  # terminationGracePeriodSeconds（需大于下面的超时）避免发布切断正在执行的写请求。
  shutdown: graceful
  servlet:
    context-path: /
  tomcat:
    threads:
      # 管理后台并发低，限制线程数降低线程栈内存占用（配合 -Xss512k）
      max: 100
      min-spare: 10

spring:
  application:
    name: mftb-admin
  lifecycle:
    # 与 server.shutdown=graceful 配套：单次停机的在途请求最晚等 30s，避免长时间挂住节点
    timeout-per-shutdown-phase: 30s
  main:
    # 懒初始化开关（高级选项，默认关闭）：开启后 Bean 延迟到首次使用时创建，可缩短启动时间；
    # 注意 CommandLineRunner（DataInitializer 等迁移逻辑）仍会在启动时执行，不受此开关影响；
    # 本地快速迭代时可设置环境变量 SPRING_LAZY_INIT=true 开启；生产环境保持默认 false
    lazy-initialization: ${SPRING_LAZY_INIT:false}
  mail:
    # MCP 外部服務（email_sender）SMTP 配置：全部透過環境變量注入，本地未配置時發送會友好報錯
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
  task:
    scheduling:
      # 定时任务启动延迟 120 秒，确保 DataInitializer schema 迁移先完成
      # 避免 @Scheduled 任务在 avatar_url 等列创建前就执行查询导致崩溃
      initial-delay: 120000
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库连接信息必须通过环境变量 DB_URL/DB_USERNAME/DB_PASSWORD 注入，禁止在代码库中保留默认凭据
    url: ${DB_URL}&socketTimeout=15000&connectTimeout=10000
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # 添加连接和查询超时配置，避免远程数据库慢查询导致前端超时
    hikari:
      connection-timeout: 30000
      max-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      keepalive-timeout: 60000
      # 连接最大存活时间，必须 < 数据库 wait_timeout，防止远端静默关闭连接导致连接池雪崩
      max-lifetime: 1800000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 5MB

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.mftb.admin.entity
  configuration:
    map-underscore-to-camel-case: true
    # 默认走 Slf4j 跟随 logging.level 控制（生产 info 不打印 SQL）；StdOutImpl 逐条打印 stdout 仅开发调试时通过环境变量启用
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.slf4j.Slf4jImpl}
    # 全局 SQL 执行超时（秒），防止慢查询
    default-timeout: 10
  global-config:
    db-config:
      # 主键自增
      id-type: auto
      # 逻辑删除字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  # 密钥（必须通过环境变量 JWT_SECRET 注入，禁止使用默认值）
  secret: ${JWT_SECRET}
  # Token 有效期（毫秒）默认 24 小时
  expiration: 86400000
  # Token 请求头名称
  header: Authorization
  # Token 前缀
  prefix: "Bearer "

# 会话空闲超时配置
session:
  # 空闲超时时间（毫秒），默认 60 分钟无操作自动登出
  idle-timeout: ${SESSION_IDLE_TIMEOUT:3600000}

# MyMemory 翻译 API 配置
translation:
  mymemory:
    # 注册 email 可将免费额度从 5000 提升至 50000 字符/天
    email: ${MYMEMORY_EMAIL:1451619287@qq.com}

# CORS 跨域配置
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,http://localhost:3005,http://localhost:3006,http://localhost:3007,http://localhost:3008,http://localhost:3009,http://localhost:3010,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3002,http://127.0.0.1:3003,http://127.0.0.1:3004,http://127.0.0.1:3005,http://127.0.0.1:3006,http://127.0.0.1:3007,http://127.0.0.1:3008,http://127.0.0.1:3009,http://127.0.0.1:3010,http://127.0.0.1:5173,https://fengsong7889.github.io,http://192.168.31.88:3000,http://192.168.31.88:3001,http://192.168.31.88:3002,http://192.168.31.88:3003,http://192.168.31.88:3004,http://192.168.31.88:3005,http://192.168.31.88:3006,http://192.168.31.88:3007,http://192.168.31.88:3008,http://192.168.31.88:3009,http://192.168.31.88:3010,http://192.168.31.88:5173,http://192.168.6.174:3000,http://192.168.6.174:3001,http://192.168.6.174:3002,http://192.168.6.174:3003,http://192.168.6.174:3004,http://192.168.6.174:3005,http://192.168.6.174:3006,http://192.168.6.174:3007,http://192.168.6.174:3008,http://192.168.6.174:3009,http://192.168.6.174:3010,http://192.168.6.174:5173}

# 数据库迁移治理（兼容式）
schema:
  # 严格模式：存在无法自愈的结构漂移时中止启动（生产设 true，配合 maxUnavailable:0）
  strict: ${SCHEMA_STRICT:false}
  # 只读预检模式：不执行初始化器/不自愈，仅校验契约并按退出码结束（0=就绪 2=漂移）
  check-only: ${SCHEMA_CHECK_ONLY:false}

# 构建/部署标识，用于迁移审计表 sys_schema_migration_log 追溯
app:
  build-tag: ${APP_BUILD_TAG:unknown}

# AI 智能中心运行参数
ai:
  llm:
    # LLM 专用 HTTP 超时：思考型模型单次补全常超 10s，不能复用通用 RestTemplate 的短超时
    connect-timeout-ms: ${AI_LLM_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${AI_LLM_READ_TIMEOUT_MS:120000}
  run:
    # WP06 过渡运行执行器：默认关闭（前端尚未接运行 API、数据分级未配置时开启只会产生失败记录）。
    # 需要后台执行队列任务时设 AI_RUN_WORKER_ENABLED=true；Temporal 上线后本执行器退役。
    worker-enabled: ${AI_RUN_WORKER_ENABLED:false}
    worker-delay-ms: ${AI_RUN_WORKER_DELAY_MS:30000}
    worker-initial-delay-ms: ${AI_RUN_WORKER_INITIAL_DELAY_MS:150000}

# 文檔中心 P0 文件載體：二進制只進對象存儲，不入 MySQL；本地開發用磁盤，生產替換 S3 實現
doc:
  storage:
    local-root: ${DOC_STORAGE_LOCAL_ROOT:./.local/doc-assets}
    max-bytes: ${DOC_STORAGE_MAX_BYTES:52428800}
    space-quota-bytes: ${DOC_STORAGE_SPACE_QUOTA_BYTES:2147483648}
  office-converter:
    # Gotenberg 内部地址；留空时 Office 预览明确返回未配置，不伪造预览
    url: ${DOC_OFFICE_CONVERTER_URL:}
    timeout-ms: ${DOC_OFFICE_CONVERTER_TIMEOUT_MS:60000}

# 騰訊文檔開放平台集成（個人開發者）：憑據經 backend/.env.local 注入，嚴禁寫死進受版本控制文件
tencent:
  docs:
    base-url: ${TENCENT_DOCS_BASE_URL:https://docs.qq.com}
    client-id: ${TENCENT_DOCS_CLIENT_ID:}
    access-token: ${TENCENT_DOCS_ACCESS_TOKEN:}
    open-id: ${TENCENT_DOCS_OPEN_ID:}
    root-folder-id: ${TENCENT_DOCS_ROOT_FOLDER_ID:}
    sync-space-id: ${TENCENT_DOCS_SYNC_SPACE_ID:1}
    # 定時同步開關與頻率：憑據配好後顯式開啟；默認每天 03:30/15:30 兩輪（錯開考勤同步）
    sync-enabled: ${TENCENT_DOCS_SYNC_ENABLED:false}
    sync-cron: ${TENCENT_DOCS_SYNC_CRON:0 30 3,15 * * ?}

# 產研交付（RDM）每日日報推送
rdm:
  daily-report:
    # 環境級總開關：默認關閉，避免聯調/本地把測試消息推到真實釘釘群。
    # 業務啟停另有頁面開關（交付配置 > 日報推送）；是否真發還受 rdm.notify.dry-run 約束。
    # 三層開關互不弱化：任一關閉都不會讓另外兩個失效。
    enabled: ${RDM_DAILY_REPORT_ENABLED:false}
    # 每分鐘 tick 一次，比對頁面配置的晨/晚報 HH:mm（改推送時間無需重啟）。
    # 冪等由「當日該檔快照已存在則跳過」保證，因此每分鐘掃一次不會重複推送。
    tick-cron: ${RDM_DAILY_REPORT_TICK_CRON:0 * * * * ?}


logging:
  level:
    # 生产默认 info（debug 会逐请求打印日志推高 CPU）；开发调试通过环境变量 LOG_LEVEL=debug 开启
    com.mftb.admin: ${LOG_LEVEL:info}
