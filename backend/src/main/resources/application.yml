server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: mftb-admin
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库连接信息必须通过环境变量 DB_URL/DB_USERNAME/DB_PASSWORD 注入，禁止在代码库中保留默认凭据
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.mftb.admin.entity
  configuration:
    map-underscore-to-camel-case: true
    # 开发环境用 StdOutImpl，生产环境通过环境变量设置为 NoLoggingImpl 或 Slf4jImpl
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.stdout.StdOutImpl}
  global-config:
    db-config:
      # 主键自增
      id-type: auto
      # 逻辑删除字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  # 密钥（必须通过环境变量 JWT_SECRET 注入，禁止使用默认值）
  secret: ${JWT_SECRET}
  # Token 有效期（毫秒）默认 24 小时
  expiration: 86400000
  # Token 请求头名称
  header: Authorization
  # Token 前缀
  prefix: "Bearer "

# 会话空闲超时配置
session:
  # 空闲超时时间（毫秒），默认 60 分钟无操作自动登出
  idle-timeout: ${SESSION_IDLE_TIMEOUT:3600000}

# MyMemory 翻译 API 配置
translation:
  mymemory:
    # 注册 email 可将免费额度从 5000 提升至 50000 字符/天
    email: ${MYMEMORY_EMAIL:1451619287@qq.com}

# CORS 跨域配置
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3002,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:3002,http://127.0.0.1:5173,https://fengsong7889.github.io}

logging:
  level:
    com.mftb.admin: ${LOG_LEVEL:debug}
